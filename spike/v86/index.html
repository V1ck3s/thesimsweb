<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      i.copy.sh (BunnyCDN) blocks requests whose Referer is localhost or any
      origin other than copy.sh — hotlink protection. Suppress the Referer
      header for all subresource fetches from this page so the CDN serves us.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>thesimsweb spike — v86 + Windows 98</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        background: #1a1a1a;
        color: #ddd;
        padding: 1rem;
      }
      header {
        max-width: 920px;
        margin: 0 auto 1rem;
      }
      header h1 {
        margin: 0 0 0.25rem;
        font-size: 1.1rem;
      }
      header p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.85rem;
      }
      #controls {
        max-width: 920px;
        margin: 0 auto 1rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        background: #2d6cdf;
        color: white;
        border: 0;
        padding: 0.4rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #stats {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        opacity: 0.7;
      }
      #screen_container {
        max-width: 920px;
        margin: 0 auto;
        background: #000;
        position: relative;
      }
      #screen_container > div {
        white-space: pre;
        font: 14px monospace;
        line-height: 14px;
      }
      #screen_container > canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>thesimsweb spike — v86 emulating Windows 98</h1>
      <p>
        Test 1 : boot Windows 98 vanilla (image &amp; state hosted on i.copy.sh).
        If this runs smoothly, we&rsquo;ll add Sims via a secondary disk in test 2.
      </p>
    </header>

    <div id="controls">
      <button id="start">Start Windows 98</button>
      <button id="pause" disabled>Pause</button>
      <button id="resume" disabled>Resume</button>
      <span id="stats">idle</span>
    </div>

    <div id="screen_container">
      <div></div>
      <canvas style="display:none"></canvas>
    </div>

    <script type="module">
      import { V86 } from "./node_modules/v86/build/libv86.mjs";

      const startBtn = document.getElementById("start");
      const pauseBtn = document.getElementById("pause");
      const resumeBtn = document.getElementById("resume");
      const stats = document.getElementById("stats");

      let emulator = null;
      let bytesDownloaded = 0;
      let lastTick = performance.now();
      let rafCount = 0;
      function rafLoop() {
        rafCount++;
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        stats.textContent = "loading…";

        emulator = new V86({
          wasm_path: "./node_modules/v86/build/v86.wasm",
          memory_size: 128 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          bios: { url: "./bios/seabios.bin" },
          vga_bios: { url: "./bios/vgabios.bin" },
          hda: {
            url: "https://i.copy.sh/windows98/.img",
            size: 300 * 1024 * 1024,
            async: true,
            fixed_chunk_size: 256 * 1024,
            use_parts: true,
          },
          initial_state: { url: "https://i.copy.sh/windows98_state-v2.bin.zst" },
          mac_address_translation: true,
          autostart: true,
        });

        emulator.add_listener("emulator-loaded", () => {
          stats.textContent = "loaded — booting state…";
        });

        emulator.add_listener("emulator-started", () => {
          pauseBtn.disabled = false;
        });

        emulator.add_listener("download-progress", (e) => {
          if (e && typeof e.loaded === "number") {
            bytesDownloaded += e.loaded;
          }
        });

        // No real FPS metric in v86 (no per-frame event for graphics mode),
        // so we display: page rAF rate as a liveness proxy + total bytes
        // streamed from the CDN. A frozen rAF means the tab is throttled.
        setInterval(() => {
          if (!emulator) return;
          const now = performance.now();
          const dt = (now - lastTick) / 1000;
          const rafFps = rafCount / dt;
          rafCount = 0;
          lastTick = now;
          const mib = (bytesDownloaded / 1024 / 1024).toFixed(1);
          const state = emulator.is_running() ? "running" : "paused";
          stats.textContent = `${state} · page ~${rafFps.toFixed(0)} fps · streamed ${mib} MiB`;
        }, 1000);
      });

      pauseBtn.addEventListener("click", () => {
        emulator?.stop();
        pauseBtn.disabled = true;
        resumeBtn.disabled = false;
        stats.textContent = "paused";
      });

      resumeBtn.addEventListener("click", () => {
        emulator?.run();
        pauseBtn.disabled = false;
        resumeBtn.disabled = true;
        stats.textContent = "running";
      });
    </script>
  </body>
</html>
