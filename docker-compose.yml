# The Sims web port on a server. Settings come from the environment or a
# `.env` file next to this one (see .env.example):
#
#   SIMS_DIR=/srv/sims/TheSims   # the install folder of The Sims (required with THESIMSWEB_GAME_FILES=server)
#   THESIMSWEB_PORT=3000          # published port
#   THESIMSWEB_BIND=127.0.0.1     # 0.0.0.0 to expose it without a reverse proxy
#   THESIMSWEB_SAVES=server       # server: one shared set of saves on the server
#                                 # client: each player's saves stay in their browser
#   THESIMSWEB_GAME_FILES=server  # server: the game is played from SIMS_DIR
#                                 # client: each player imports their own copy of the game
#                                 # into their browser; the server serves no game file
#                                 # (forces THESIMSWEB_SAVES=client, SIMS_DIR not needed)
#
#   docker compose up -d --build
#
# The server has no authentication: anyone who reaches it can play and
# overwrite the saves. Put it behind a reverse proxy with authentication, or
# keep it on a private network. See docs/docker.md.
services:
  thesimsweb:
    build: .
    image: thesimsweb:latest
    restart: unless-stopped
    environment:
      SAVES: "${THESIMSWEB_SAVES:-server}"
      GAME_FILES: "${THESIMSWEB_GAME_FILES:-server}"
    ports:
      - "${THESIMSWEB_BIND:-127.0.0.1}:${THESIMSWEB_PORT:-3000}:3000"
    volumes:
      # The game folder, never written to (never served when GAME_FILES=client;
      # without SIMS_DIR, an empty folder next to this file).
      - "${SIMS_DIR:-./server/assets/Sims}:/app/server/assets/Sims:ro"
      # Saves (UserData* written by the game), kept across rebuilds (unused when SAVES=client).
      - saves:/app/server/data/overlay

volumes:
  saves:
