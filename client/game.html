<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Les Sims</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #screen canvas { display: block; cursor: default; }
      /* Touch screens: the game takes every gesture (no page scroll, zoom, callout or selection). */
      #screen, #screen canvas { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      html, body { overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
