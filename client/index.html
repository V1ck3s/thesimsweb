<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thesimsweb</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font-family: ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1024" height="768"></canvas>
      <div id="hud" style="position:fixed;top:8px;left:8px;font:12px/1.4 ui-monospace,monospace;color:#9ad;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:4px;pointer-events:none;max-width:60%;">loading…</div>
      <canvas id="sprite-overlay" width="128" height="128" style="position:fixed;bottom:12px;right:12px;background:#222;border:1px solid #444;image-rendering:pixelated;"></canvas>
      <canvas id="object-viewer" width="256" height="192" style="position:fixed;bottom:12px;right:160px;background:#222;border:1px solid #444;image-rendering:pixelated;"></canvas>
      <div id="object-label" style="position:fixed;bottom:210px;right:160px;font:11px/1.3 ui-monospace,monospace;color:#9ad;background:rgba(0,0,0,.55);padding:4px 6px;border-radius:3px;pointer-events:none;"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
