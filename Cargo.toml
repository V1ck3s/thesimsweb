[workspace]
resolver = "2"
members = [
    "crates/iff",
    "crates/far",
    "crates/sprite",
    "crates/simantics",
    "crates/wasm-bindings",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "(local)"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
thiserror = "2"
